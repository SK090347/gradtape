<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>gradtape — live demo</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:32px 18px}
h1{margin:0 0 6px}.sub{color:var(--muted);margin-bottom:14px} a{color:var(--accent)}
canvas{width:100%;max-width:640px;height:220px;background:var(--card);border:1px solid #30363d;border-radius:12px}
button{margin-top:12px;background:#238636;border:0;color:#fff;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
pre{background:var(--card);border:1px solid #30363d;border-radius:10px;padding:12px;margin-top:12px}
</style></head><body><main>
<h1>gradtape</h1>
<p class="sub">Reverse-mode autodiff tape · XOR MLP · <a href="https://github.com/SK090347/gradtape">GitHub</a></p>
<button id="go">Train XOR (400 steps)</button>
<canvas id="c" width="640" height="220"></canvas>
<pre id="log">ready — click Train</pre>
<script>
class V{
  constructor(d,ch=[],_op=''){this.data=d;this.grad=0;this.prev=ch;this._bw=()=>{}}
  add(o){o=o instanceof V?o:new V(o);const out=new V(this.data+o.data,[this,o]);out._bw=()=>{this.grad+=out.grad;o.grad+=out.grad};return out}
  mul(o){o=o instanceof V?o:new V(o);const out=new V(this.data*o.data,[this,o]);out._bw=()=>{this.grad+=o.data*out.grad;o.grad+=this.data*out.grad};return out}
  tanh(){const t=Math.tanh(this.data),out=new V(t,[this]);out._bw=()=>{this.grad+=(1-t*t)*out.grad};return out}
  backward(){const order=[];const seen=new Set();(function t(v){if(seen.has(v))return;seen.add(v);for(const p of v.prev)t(p);order.push(v)})(this);for(const v of order)v.grad=0;this.grad=1;for(let i=order.length-1;i>=0;i--)order[i]._bw()}
}
function train(){
  const params=[]; const P=(x)=>{const v=new V(x);params.push(v);return v};
  const W1=[[P(Math.random()*2-1),P(Math.random()*2-1)],[P(Math.random()*2-1),P(Math.random()*2-1)],[P(Math.random()*2-1),P(Math.random()*2-1)],[P(Math.random()*2-1),P(Math.random()*2-1)]];
  const B1=[P(0),P(0),P(0),P(0)];
  const W2=[P(Math.random()*2-1),P(Math.random()*2-1),P(Math.random()*2-1),P(Math.random()*2-1)];
  const B2=P(0);
  const forward=(x0,x1)=>{
    const h=[];
    for(let i=0;i<4;i++) h.push(W1[i][0].mul(x0).add(W1[i][1].mul(x1)).add(B1[i]).tanh());
    let y=B2; for(let i=0;i<4;i++) y=y.add(W2[i].mul(h[i]));
    return y.tanh();
  };
  const xs=[[0,0],[0,1],[1,0],[1,1]]; const ys=[0,1,1,0];
  const losses=[]; let lr=0.15; let last='';
  for(let ep=0;ep<400;ep++){
    let loss=new V(0);
    for(let i=0;i<4;i++){const pred=forward(xs[i][0],xs[i][1]); const d=pred.add(-ys[i]); loss=loss.add(d.mul(d));}
    loss.backward();
    for(const p of params){p.data -= lr*p.grad}
    losses.push(loss.data);
    if(ep%80===0) last+=`epoch ${ep}  loss ${loss.data.toFixed(4)}\n`;
  }
  let preds='preds: ';
  for(let i=0;i<4;i++){const p=forward(xs[i][0],xs[i][1]); preds+=`(${xs[i]})→${p.data.toFixed(2)}  `}
  document.getElementById('log').textContent=last+preds;
  const ctx=document.getElementById('c').getContext('2d');
  ctx.clearRect(0,0,640,220); ctx.strokeStyle='#58a6ff'; ctx.beginPath();
  const m=Math.max(...losses,1e-9);
  losses.forEach((v,i)=>{const x=10+i/losses.length*620,y=210-(v/m)*190; i?ctx.lineTo(x,y):ctx.moveTo(x,y)}); ctx.stroke();
}
document.getElementById('go').onclick=train;
</script></main></body></html>
